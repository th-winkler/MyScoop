name: Update Juxtopposed VLC manifest
on:
  workflow_dispatch:
  schedule:
    - cron: '47 8 * * *'
permissions:
  contents: write
concurrency:
  group: myscoop-manifest-writes
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TARGET_MANIFEST: bucket/juxtopposed-vlc.json
    steps:
      - name: Check out bucket
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
      - name: Validate current bucket before any mutation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          ./scripts/validate-bucket.ps1
      - name: Test Juxtopposed release selection offline
        shell: pwsh
        run: ./scripts/tests/test-juxtopposed-release.ps1
      - name: Verify Juxtopposed VLC prerelease and compute manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $logDir = Join-Path $env:RUNNER_TEMP 'myscoop-diagnostics'
          New-Item -ItemType Directory -Path $logDir -Force | Out-Null
          Start-Transcript -Path (Join-Path $logDir 'update-juxtopposed-vlc.log') -Force | Out-Null
          try {
            ./scripts/update-juxtopposed-vlc.ps1
          } finally {
            Stop-Transcript | Out-Null
          }
      - name: Validate updated bucket before any commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          ./scripts/validate-bucket.ps1
      - name: Commit only the expected manifest
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$changed" ]]; then
            while IFS= read -r line; do
              path="${line:3}"
              if [[ "$path" != "$TARGET_MANIFEST" ]]; then
                echo "::error::Unexpected changed file: $path (expected only $TARGET_MANIFEST)"
                exit 1
              fi
            done <<< "$changed"
          fi
          if git diff --quiet -- "$TARGET_MANIFEST"; then
            echo "No manifest change; not committing."
            exit 0
          fi
          git add -- "$TARGET_MANIFEST"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(bucket): update juxtopposed-vlc'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Publish manifest summary
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath $env:TARGET_MANIFEST) {
            $manifest = Get-Content -LiteralPath $env:TARGET_MANIFEST -Raw | ConvertFrom-Json -AsHashtable
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Current ``$env:TARGET_MANIFEST`` version: ``$($manifest.version)``"
          }
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: myscoop-juxtopposed-vlc-failure-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/myscoop-diagnostics/**
            bucket/juxtopposed-vlc.json
