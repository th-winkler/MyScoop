name: Update FluentFlyout manifest
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
permissions:
  contents: write
concurrency:
  group: myscoop-manifest-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Validate all manifests before update
        shell: pwsh
        run: ./scripts/validate-bucket.ps1
      - name: Verify upstream checksum and refresh FluentFlyout
        shell: pwsh
        run: ./scripts/update-fluentflyout.ps1
      - name: Validate all manifests after update
        shell: pwsh
        run: ./scripts/validate-bucket.ps1
      - name: Commit only the FluentFlyout manifest
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- bucket/fluentflyout.json; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- bucket/fluentflyout.json
          git commit -m 'chore(bucket): update fluentflyout'
          git push
