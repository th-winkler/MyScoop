name: Update FluentFlyout Scoop manifest

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *' # Every day, UTC

permissions:
  contents: write

concurrency:
  group: fluentflyout-manifest-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out MyScoop
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update the verified installer manifest
        shell: pwsh
        run: ./scripts/update-fluentflyout.ps1
      - name: Commit new version if changed
        shell: bash
        run: |
          if git diff --quiet -- bucket/fluentflyout.json; then
            echo 'No new upstream version.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- bucket/fluentflyout.json
          git commit -m 'chore(bucket): update fluentflyout'
          git push
